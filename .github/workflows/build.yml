name: Build SideStore

on:
  workflow_dispatch: 
  push:
    branches: [ "change-id" ]

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Patch Bundle ID and App Groups
        run: |
          OLD_APP_ID="com.SideStore.SideStore"
          NEW_APP_ID="dev.project516.sidestore"
          
          OLD_ORG="com.SideStore"
          NEW_ORG="dev.project516"
          
          export LC_ALL=C
          
          echo "Patching exact App ID: $OLD_APP_ID -> $NEW_APP_ID"
          find . -type f \( \
            -name "*.pbxproj" \
            -o -name "*.plist" \
            -o -name "*.entitlements" \
            -o -name "*.xml" \
            -o -name "*.xcconfig" \
            -o -name "*.swift" \
            -o -name "*.m" \
            -o -name "*.h" \
            -o -name "*.c" \
            -o -name "*.cpp" \
            -o -name "*.xcstrings" \
            -o -name "*.json" \
          \) -print0 | xargs -0 sed -i '' "s/$OLD_APP_ID/$NEW_APP_ID/g"

          echo "Patching base Org ID: $OLD_ORG -> $NEW_ORG"
          find . -type f \( \
            -name "*.pbxproj" \
            -o -name "*.plist" \
            -o -name "*.entitlements" \
            -o -name "*.xml" \
            -o -name "*.xcconfig" \
            -o -name "*.swift" \
            -o -name "*.m" \
            -o -name "*.h" \
            -o -name "*.c" \
            -o -name "*.cpp" \
            -o -name "*.xcstrings" \
            -o -name "*.json" \
          \) -print0 | xargs -0 sed -i '' "s/$OLD_ORG/$NEW_ORG/g"

      - name: Build with Xcode (Bypassing Archive Validation)
        run: |
          set -o pipefail
          
          # Explicitly resolve dependencies first
          xcodebuild -resolvePackageDependencies
          
          # Build against the .xcodeproj as required by the latest SideStore source
          xcodebuild build \
            -project SideStore.xcodeproj \
            -scheme SideStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO | xcbeautify

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SideStore.app Payload/
          zip -r SideStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-Custom
          path: SideStore.ipa
          retention-days: 7
